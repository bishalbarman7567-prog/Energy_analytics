version: "3.8"

services:
  energyiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: energyiq-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///raw/seed.sqlite
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - ./raw:/app/raw
      - ./output:/app/output

